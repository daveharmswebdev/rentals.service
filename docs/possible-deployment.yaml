apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-service
  namespace: default  # Change if needed
spec:
  replicas: 1  # Add this
  selector:    # Add this
    matchLabels:
      app: my-service
  template:
    metadata:
      labels:
        app: my-service
    spec:
      serviceAccountName: gke-deployer
      containers:
      # Main application container
      - name: rentals-portal-service
        image: us-central1-docker.pkg.dev/properties-portal/docker-repo/rentals-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DB_HOST
          value: "127.0.0.1"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "your_database_name"  # Add your DB name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      
      # Cloud SQL Proxy sidecar
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-docker/cloud-sql-proxy:1.33.2
        command:
          - "/cloud_sql_proxy"
          - "-instances=properties-portal:us-central1:pp-dev=tcp:127.0.0.1:5432"
          - "-use_http_health_check_server=true"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
