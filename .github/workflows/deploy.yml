name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: properties-portal
  GKE_CLUSTER: rental-portals-service-cluster
  GKE_ZONE: us-central1
  DEPLOYMENT_NAME: rentals-portal-service
  REPOSITORY: docker-repo
  IMAGE: rentals-portal
  NAMESPACE: development

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Run test coverage
      run: npm run test:coverage

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test
    # Only run on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Authenticate to Google Cloud using Workload Identity Federation
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    # Setup gcloud CLI
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2


    # Install gke-gcloud-auth-plugin
    - name: Install GKE auth plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin

    # Configure Docker to use gcloud as a credential helper
    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev

    # Get GKE credentials
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials $GKE_CLUSTER \
          --zone $GKE_ZONE \
          --project $PROJECT_ID

    # Build the Docker image with commit SHA tag
    - name: Build Docker image
      run: |
        docker build \
          --tag "us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA" \
          --tag "us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest" \
          .

    # Push the Docker image to Google Artifact Registry
    - name: Push Docker image to GAR
      run: |
        docker push "us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA"
        docker push "us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest"

    # Update the Kubernetes deployment with new image
    - name: Deploy to GKE
      run: |
        kubectl set image deployment/$DEPLOYMENT_NAME \
          $DEPLOYMENT_NAME=us-central1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:$GITHUB_SHA \
          --namespace=$NAMESPACE
        
        kubectl rollout status deployment/$DEPLOYMENT_NAME \
          --namespace=$NAMESPACE \
          --timeout=5m

    # Verify deployment
    - name: Verify deployment
      run: |
        kubectl get services -n $NAMESPACE
        kubectl get pods -n $NAMESPACE
        kubectl describe deployment $DEPLOYMENT_NAME -n $NAMESPACE

    # Output deployment info
    - name: Get deployment URL
      run: |
        echo "Deployment completed successfully!"
        echo "Getting service external IP..."
        kubectl get service $DEPLOYMENT_NAME -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
