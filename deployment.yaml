apiVersion: apps/v1
kind: Deployment
metadata:
  name: rentals-portal-service
  namespace: development
  labels:
    app: rentals-portal-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rentals-portal-service
  template:
    metadata:
      labels:
        app: rentals-portal-service
    spec:
      serviceAccountName: gke-service-account
      containers:
      # Main Application Container
      - name: rentals-portal-service
        image: us-central1-docker.pkg.dev/properties-portal/docker-repo/rentals-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: GCP_PROJECT_ID
          value: "properties-portal"
        - name: GCP_REGION
          value: "us-central1"
        - name: GKE_CLUSTER_NAME
          value: "rental-portals-service-cluster"
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: APP_VERSION
          value: "1.0.0"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: DB_HOST
          value: "127.0.0.1"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "rentals_db"
        - name: PGSSLMODE
          value: "disable"
        # Google OAuth Configuration
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google-oauth-credentials
              key: client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google-oauth-credentials
              key: client-secret
        - name: GOOGLE_CALLBACK_URL
          value: "https://api.gatherhubs.com/auth/google/callback"
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: session-credentials
              key: secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

      # Cloud SQL Proxy Sidecar
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.7.0
        command:
          - "/cloud-sql-proxy"
          - "--port=5432"
          - "properties-portal:us-central1:pp-dev"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: rentals-portal-service
  namespace: development
spec:
  type: NodePort
  selector: 
    app: rentals-portal-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rentals-portal-ingress
  namespace: development
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "rentals-portal-cert"
    kubernetes.io/ingress.global-static-ip-name: "rentals-portal-ip"
spec:
  rules:
  - host: api.gatherhubs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rentals-portal-service
            port:
              number: 80

---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: rentals-portal-cert
  namespace: development
spec:
  domains:
    - api.gatherhubs.com
